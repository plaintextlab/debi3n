# === Font ===
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12

# === Cursor ===
cursor_shape underline
# blink_interval 200ms in Alacritty -> on/off timing in seconds here
cursor_blink_interval 0.2 0.2
# blink_timeout 0 in Alacritty (never stop blinking) -> 0 means blink forever
cursor_stop_blinking_after 0

# === Colors (gruvbox) ===
background #282828
foreground #ebdbb2

# normal
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984

# bright
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
