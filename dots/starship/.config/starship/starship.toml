# ~/.config/starship.toml
# Tokyo Night palette — beautiful, modern, readable

palette = "motif"

add_newline = true
command_timeout = 1000
scan_timeout = 30

# Two-line prompt with all the good stuff
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$rust\
$golang\
$java\
$php\
$docker_context\
$kubernetes\
$aws\
$cmd_duration\
$line_break\
$character"""

# ── OS icon ──────────────────────────────────────────────
[os]
disabled = false
format = "[$symbol](bold fg:os_color) "

[os.symbols]
Ubuntu = "󰕈"
Debian = "󰣚"
Arch = "󰣇"
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"
Linux = "󰌽"

# ── Username ──────────────────────────────────────────────
[username]
show_always = false
format = "[$user]($style) "
style_user = "bold fg:user_color"
style_root = "bold red"

# ── Hostname (only on SSH) ────────────────────────────────
[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold fg:host_color"

# ── Directory ─────────────────────────────────────────────
[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold fg:dir_color"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = true
home_symbol = "󰜥 ~"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Projects" = "󰲋"
"Desktop" = ""

# ── Git ───────────────────────────────────────────────────
[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold fg:git_color"
truncation_length = 25
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold fg:git_status_color"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "󰋖 ${count}"
stashed = " ${count}"
modified = " ${count}"
staged = " ${count}"
renamed = "󰑕 ${count}"
deleted = " ${count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ── Languages ─────────────────────────────────────────────
[nodejs]
format = "via [ $version]($style) "
style = "bold fg:node_color"
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[python]
format = 'via [󰌠 $version( \($virtualenv\))]($style) '
style = "bold fg:python_color"
detect_extensions = ["py"]

[rust]
format = "via [ $version]($style) "
style = "bold fg:rust_color"

[golang]
format = "via [ $version]($style) "
style = "bold fg:go_color"

[java]
format = "via [ $version]($style) "
style = "bold fg:java_color"
detect_files = ["pom.xml", "build.gradle"]

[php]
format = "via [ $version]($style) "
style = "bold fg:php_color"

# ── Docker / K8s / Cloud ──────────────────────────────────
[docker_context]
format = "via [ $context]($style) "
style = "bold fg:docker_color"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[kubernetes]
format = "on [ $context\\($namespace\\)]($style) "
style = "bold fg:k8s_color"
disabled = false

[aws]
format = 'on [ ($profile)(\[$duration\])]($style) '
style = "bold fg:aws_color"
disabled = true   # enable if you use AWS

[gcloud]
disabled = true

# ── Command duration ──────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = "[ $duration]($style) "
style = "bold fg:duration_color"
show_notifications = false

# ── Prompt character ──────────────────────────────────────
[character]
success_symbol = "[❯](bold fg:prompt_ok)"
error_symbol = "[❯](bold fg:prompt_err)"
vimcmd_symbol = "[❮](bold fg:prompt_vim)"

# ── Package (hide — too noisy) ────────────────────────────
[package]
disabled = true

