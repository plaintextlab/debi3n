[font]
size = 16

[cursor.style]
shape = "Underline"
blinking = "Always"  # Options: Always, Never, WhenFocused

[cursor]
blink_interval = 200 # Interval in milliseconds
blink_timeout = 0

[font.normal]
family = "moreperfectdosvga"
style = "Regular"

[font.bold]
family = "moreperfectdosvga"
style = "Bold"

[font.italic]
family = "moreperfectdosvga"
style = "Italic"

[font.bold_italic]
family = "moreperfectdosvga"
style = "Bold Italic"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
