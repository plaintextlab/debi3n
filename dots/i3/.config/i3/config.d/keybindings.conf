# Use Mouse+$win to drag floating windows to their wanted position
floating_modifier $win

# eg. Pressing $win+2 will back and forth between 2nd and last used workspace
workspace_auto_back_and_forth yes

# keyboard_shortcut_comment: Win + m -> Music Player
bindsym $win+m exec --no-startup-id $DEFAULT_TERMINAL -e $DEFAULT_MUSIC_PLAYER

# keyboard_shortcut_comment: Win + Shift + m -> Video Player
bindsym $win+$shift+m exec --no-startup-id $DEFAULT_VIDEO_PLAYER

# keyboard_shortcut_comment: Win + b -> Start Default Browser
# keyboard_shortcut_comment: Win + Shift + b -> Start Browser in Private Window
bindsym $win+b exec --no-startup-id $DEFAULT_BROWSER
bindsym $win+$shift+b exec --no-startup-id $DEFAULT_BROWSER_PRIVATE

# keyboard_shortcut_comment: Win + q / Alt F4 -> Kill focused window
bindsym $win+q kill
bindsym $alt+F4 kill

# keyboard_shortcut_comment: Win + Shift + q -> XKill
bindsym $win+$shift+q exec --no-startup-id xkill

# keyboard_shortcut_comment: Win + d -> Start Rofi
bindsym $win+d exec "rofi -modi drun,run -show drun"

# keyboard_shortcut_comment: Win + space -> Show all running programs in rofi menu
bindsym $win+space exec "rofi -show window"

# keyboard_shortcut_comment: Win + t -> browse all notes with fzf
bindsym $win+t exec --no-startup-id $DEFAULT_TERMINAL --title "notes-picker" -e bash "$SCRIPTS_PATH/script-notes.sh"

# keyboard_shortcut_comment: Win + Shift + t -> create a new note
bindsym $win+$shift+t exec --no-startup-id $DEFAULT_TERMINAL --title "notes-new" -e bash "$SCRIPTS_PATH/script-notes.sh --new"

# keyboard_shortcut_comment: Win + Enter -> Start default terminal
bindsym $win+Return exec $DEFAULT_TERMINAL



# Play / Pause, Stop, Next, Previous buttons on Keyboard - Install playerctl

# For Non multimedia Keyboards
# keyboard_shortcut_comment: Numpad 6 (Numlock off) -> Play next
bindsym KP_Right exec --no-startup-id playerctl next
# keyboard_shortcut_comment: Numpad 4 (Numlock off) -> Play previous
bindsym KP_Left exec --no-startup-id playerctl previous
# keyboard_shortcut_comment: Numpad 5 (Numlock off) -> Play / Pause
bindsym KP_Begin exec --no-startup-id playerctl play-pause && notify-send "$(playerctl metadata --format '{{ artist }} - {{ title }}')"
# keyboard_shortcut_comment: Numpad . (Numlock off) -> Stop
bindsym KP_Delete exec --no-startup-id playerctl stop


# Play / Pause, Stop, Next, Previous for Laptops
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause && notify-send "$(playerctl metadata --format '{{ artist }} - {{ title }}')"
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym XF86AudioStop exec --no-startup-id playerctl stop



# Volume controls
# keyboard_shortcut_comment: Numpad 8 (Numlock off) - Volume Up
bindsym KP_Up exec --no-startup-id "$SCRIPTS_PATH/script-volume-slider.sh up"
# keyboard_shortcut_comment: Numpad 2 (Numlock off) - Volume Down
bindsym KP_Down exec --no-startup-id "$SCRIPTS_PATH/script-volume-slider.sh down"
# keyboard_shortcut_comment: Numpad 0 (Numlock off) - Mute
bindsym KP_Insert exec --no-startup-id "$SCRIPTS_PATH/script-volume-slider.sh toggle"


# Volume controls for laptop
bindsym XF86AudioRaiseVolume exec --no-startup-id "$SCRIPTS_PATH/script-volume-slider.sh up"
bindsym XF86AudioLowerVolume exec --no-startup-id "$SCRIPTS_PATH/script-volume-slider.sh down"
bindsym XF86AudioMute exec --no-startup-id "$SCRIPTS_PATH/script-volume-slider.sh toggle"


# change focus
# keyboard_shortcut_comment: Win + Left Arrow -> Focus Window Left
bindsym $win+Left focus left
# keyboard_shortcut_comment: Win + Right Arrow -> Focus Window Right
bindsym $win+Right focus right
# keyboard_shortcut_comment: Win + Up Arrow -> Focus Window Up
bindsym $win+Up focus up
# keyboard_shortcut_comment: Win + Down Arrow -> Focus Window Down
bindsym $win+Down focus down

# keyboard_shortcut_comment: Win + k -> Show keybindings
bindsym $win+k exec --no-startup-id "$I3_SCRIPTS_PATH/i3-keybindings.sh"

# keyboard_shortcut_comment: Ctrl+Tab -> Cycle forward within current workspace
bindsym ctrl+Tab focus next
# keyboard_shortcut_comment: Ctrl+Shift+Tab: Cycle backward within current workspace
bindsym ctrl+$shift+Tab focus prev
# keyboard_shortcut_comment: Alt+Tab: Cycle back and forth beween last used workspace and current workspace
bindsym Mod1+Tab workspace back_and_forth


# keyboard_shortcut_comment: Win + Shift +        -> Move focused windows
bindsym $win+$shift+Left move left
bindsym $win+$shift+Down move down
bindsym $win+$shift+Up move up
bindsym $win+$shift+Right move right


# keyboard_shortcut_comment: Win + Shift + h -> Split windows in horizontal orientation
bindsym $win+$shift+h split h

# keyboard_shortcut_comment: Win + Shift + v -> Split windows in vertical orientation
bindsym $win+$shift+v split v

# keyboard_shortcut_comment: Win + f -> Fullscreen mode
bindsym $win+f fullscreen toggle

# keyboard_shortcut_comment: Win + e -> Open filemanager
bindsym $win+e exec --no-startup-id $DEFAULT_FILEMANAGER

# keyboard_shortcut_comment: Win + s -> Container layout STACKED
bindsym $win+s layout stacking
# keyboard_shortcut_comment: Win + w -> Container layout TABBED
bindsym $win+w layout tabbed
# keyboard_shortcut_comment: Win + x -> Container layout TOGGLE SPLIT V/H
bindsym $win+x layout toggle split
# keyboard_shortcut_comment: Win + x -> Container layout menu
bindsym $win+$ctrl+l exec --no-startup-id ~/.config/i3/scripts/i3_layout.sh

# keyboard_shortcut_comment: Win + Alt + l -> Lock Screen (Child lock)
bindsym $win+$alt+l exec xtrlock

# keyboard_shortcut_comment: Win + Shift + Space -> Toggle tiling / floating
bindsym $win+Shift+space floating toggle

# keyboard_shortcut_comment: Win + Shift + Space -> Toggle focus between tiling/floating windows
#bindsym $win+$shift+space focus mode_toggle

# keyboard_shortcut_comment: Win + n -> Activate Night light
bindsym $win+n exec --no-startup-id redshift -O 3500

# keyboard_shortcut_comment: Win + Shift + n -> Disable Night light
bindsym $win+$shift+n exec --no-startup-id redshift -x

# keyboard_shortcut_comment: Win + Shift + w -> Change wallpaper
bindsym $win+$shift+w exec --no-startup-id feh --randomize --bg-fill $WALLPAPER_DIR

# keyboard_shortcut_comment: Win + p -> Change audio output device
bindsym $win+p exec --no-startup-id $ROFI_SCRIPTS_PATH/rofi-audio-output-switch.sh

# keyboard_shortcut_comment: Win + Shift + p -> Change audio input device
bindsym $win+$shift+p exec --no-startup-id $ROFI_SCRIPTS_PATH/rofi-audio-input-switch.sh

# keyboard_shortcut_comment: Win + Shift + l -> Power menu
bindsym $win+Shift+l exec --no-startup-id $ROFI_SCRIPTS_PATH/rofi-powermenu.sh

# keyboard_shortcut_comment: Win + 0 - 9 -> Switch workspaces
bindsym $win+1 workspace number $ws1
bindsym $win+2 workspace number $ws2
bindsym $win+3 workspace number $ws3
bindsym $win+4 workspace number $ws4
bindsym $win+5 workspace number $ws5
bindsym $win+6 workspace number $ws6
bindsym $win+7 workspace number $ws7
bindsym $win+8 workspace number $ws8
bindsym $win+9 workspace number $ws9
bindsym $win+0 workspace number $ws10

# keyboard_shortcut_comment: Win + 0 - 9 -> Move focused container to workspace
bindsym $win+$shift+1 move container to workspace number $ws1
bindsym $win+$shift+2 move container to workspace number $ws2
bindsym $win+$shift+3 move container to workspace number $ws3
bindsym $win+$shift+4 move container to workspace number $ws4
bindsym $win+$shift+5 move container to workspace number $ws5
bindsym $win+$shift+6 move container to workspace number $ws6
bindsym $win+$shift+7 move container to workspace number $ws7
bindsym $win+$shift+8 move container to workspace number $ws8
bindsym $win+$shift+9 move container to workspace number $ws9
bindsym $win+$shift+0 move container to workspace number $ws10


# reload the configuration file
