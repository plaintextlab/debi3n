# Motif / CDE colors
# panel/window face
set $bg          #c6b2a8
# darker panel variant
set $bg-alt      #a8988f
set $fg          #000000
set $fg-dim      #4a4a45
# menu bar / accent
set $teal        #4992a7
# active titlebar
set $peach       #eda870
# inactive titlebar
set $grey        #999999
# selected/highlight
set $select      #8998aa
# not present in source image — kept from prior palette
set $red         #993333
set $gray        #7a7a72

# Window colors
# <border> <background> <text> <indicator> <child_border>

client.focused          $peach     $peach     #000000  $peach    $peach
client.focused_inactive $select    $select    #000000  $gray     $select
client.unfocused        $grey      $grey      $fg-dim  $gray     $grey
client.urgent           $red       $red       #ffffff  $red      $red
client.placeholder      $bg        $bg        $fg      $bg       $bg


