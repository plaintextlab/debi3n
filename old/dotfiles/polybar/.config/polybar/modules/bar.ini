[bar/mainbar]
monitor = ${env:MONITOR:}
width = 100%
height = 18pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

bottom = false

line-size = 6pt

#border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.flamingo}

#font-0 = MesloLGS Nerd Font Mono:size=14;6
#font-1 = Font Awesome 6 Free:pixelsize=12;2
#font-2 = Font Awesome 6 Free Solid:pixelsize=12;2
#font-3 = Font Awesome 6 Brands:pixelsize=12;2

#font-0 = IBM Plex Mono:size=14;2
#font-0 = "FiraCode Nerd Font Mono:size=14;1"
#font-1 = "Noto Color Emoji:size=14;1"
#; optionally a regular UI font:
#font-2 = "Noto Sans:size=14;1"

#font-0 = "FiraCode Nerd Font:size=14;3"
#font-1 = "FiraCode Nerd Font:size=14;4"

font-0 = "JetBrainsMono Nerd Font:size=14;3"
font-1 = "JetBrainsMono Nerd Font:size=14;4"

; modules-left = i3-layout-single xworkspaces xwindow
modules-left = xworkspaces xwindow
; modules-right = mpris-text mpris-controls pulseaudio bluetooth battery systray date
modules-right = screenrecord current-audio-device pulseaudio tray-toggle systray date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true




