# Full Nord color scheme

# Polar Night
set $bg        #2e3440
set $bg-alt    #3b4252
set $bg-light  #434c5e
set $gray      #4c566a

# Snow Storm
set $fg        #eceff4
set $fg-dim    #d8dee9

# Frost
set $frost1    #8fbcbb
set $frost2    #88c0d0
set $frost3    #81a1c1
set $frost4    #5e81ac

# Aurora
set $red       #bf616a
set $orange    #d08770
set $yellow    #ebcb8b
set $green     #a3be8c
set $purple    #b48ead

# Window colors (no yellow focus anymore)
client.focused          $frost3  $frost3  $bg       $frost3  $frost3
client.focused_inactive $bg-alt  $bg-alt  $fg-dim   $gray    $bg-alt
client.unfocused        $bg      $bg      $fg-dim   $gray    $bg
client.urgent           $red     $red     $fg       $red     $red
client.placeholder      $bg-light $bg-light $fg     $bg-light $bg-light

