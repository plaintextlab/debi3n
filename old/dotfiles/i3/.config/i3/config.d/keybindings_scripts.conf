# Super + Space  →  browse all notes with fzf
bindsym $mod+t exec --no-startup-id $DEFAULT_TERMINAL --title "notes-picker" -e bash "$HOME/.config/scripts/notes.sh"

# Super + Shift + Space  →  create a new note
bindsym $mod+shift+t exec --no-startup-id $DEFAULT_TERMINAL --title "notes-new" -e bash "$HOME/.config/scripts/notes.sh" --new

# Optional: float both windows and centre them automatically
# (add this alongside the bindsyms above, or in your for_window block)
for_window [title="notes-picker"] floating enable, resize set 900 600, move position center
for_window [title="notes-new"]   floating enable, resize set 1200 800, move position center
